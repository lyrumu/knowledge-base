# 首页固定三入口数据契约，顺序即首帧索引和卡片显现顺序。
# - sections 必须正好为 3 组；id 必须唯一。
# - meta 只承载卡片上的简短标签，不再伪装成可点击的精选条目。
# - visual.kind 与图片数量：docs-stack=3、project-stage=1、music-fan=3。
sections:
  - id: "docs"
    kicker: "Reading & Notes"
    desc: "Some of my study records"
    cta_label: "Open Docs"
    cta_path: "/notes/"
    meta:
      - "ChatGPT"
      - "Agent Config"
      - "Git Basics"
    visual:
      kind: "docs-stack"
      alt: "Selected covers from the documentation archive"
      assets:
        - "image/notes/Codex-Plus.png"
        - "image/notes/for-agent.png"
        - "image/notes/git.png"

  - id: "works"
    kicker: "Built & Shared"
    desc: "Projects and things made to be opened, tested, or downloaded rather than only read about."
    cta_label: "Open Works"
    cta_path: "/works/"
    meta:
      - "Projects"
    visual:
      kind: "project-stage"
      alt: "Geometric artwork from the linear algebra project"
      assets:
        - "image/projects/linear-algebra-cover.webp"

  - id: "daily"
    kicker: "Slow & Small"
    desc: "Collect some high-quality items"
    cta_label: "Open Daily"
    cta_path: "/life/"
    meta:
      - "Listening"
    visual:
      kind: "music-fan"
      alt: "A selection of album covers from the current playlist"
      assets:
        - "image/music/cover-Departures.webp"
        - "image/music/cover-my-dearest.webp"
        - "image/music/cover-unravel.webp"
