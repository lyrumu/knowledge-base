# =============================================================================
# works 模块的索引数据 — 相关（/works/）入口页
# 数据驱动：layouts/shortcodes/works-grid.html 渲染
# 想加 / 删 / 调子模块：只改本文件即可
#   - id     : 子模块 url slug（如 projects → /works/projects/）
#   - name   : 卡片标题
#   - title  : 卡片副标题（衬线大写小标）
#   - icon   : Lucide icon 名字（layouts/partials/cover/icon.html）
#   - desc   : 卡片描述（衬线斜体）
#   - href   : 跳转链接（推荐 /works/<id>/）
#   - tags   : 底部小 tag 列表（可选）
#   - draft  : true 则标注为"准备中"
#
# 注意：2026-06-21 视觉统一后，works 卡片与 /about/ 主入口 module-card 同源
# 2026-06-24：/start/ 大厅页已删除，注释更新
#       不再使用封面（cover / cover_style 字段已删除）
# =============================================================================
submodules:
  - id: projects
    name: "PROJECTS"
    title: "Projects · Vibe Coding"
    icon: "code-1"
    desc: "vibe coding、demo"
    href: "/works/projects/"
    tags: [demos, agents, experiments]

  - id: resources
    name: "RESOURCES"
    title: "Resources · Downloadables"
    icon: "package"
    desc: "Maybe something useful that you can donwload"
    href: "/works/resources/"
    tags: [downloads, free-use]
    draft: true #里面其实预留了一个minecraft 但是应该先标注为"准备中"

  - id: tools
    name: "TOOLS"
    title: "Tools · Skills & Scripts"
    icon: "wrench"
    desc: ""
    href: "/works/tools/"
    tags: [scripts, skills]
    draft: true

