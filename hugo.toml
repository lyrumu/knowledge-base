# =============================================================================
# lyrumu's site — Hugo configuration
# Theme: Blowfish · 部署 Cloudflare Pages
#
# 模块说明：
#   - 封面（/）         → 无顶栏，只显示标题 + 入口按钮
#   - 大厅（/start/）   → 真正进入后的第一页，有顶栏
#   - 4 个模块：notes / life / works / about
#   - 加新模块 = hugo.toml 加 menu + content/<slug>/_index.md
# =============================================================================

baseURL = 'https://knowledge-base-85b.pages.dev/'
defaultContentLanguage = 'zh-cn'
title = "lyrumu's page"

# =============================================================================
# 多语言
# =============================================================================
[languages.zh-cn]
  label = '简体中文'
  weight = 1
  locale = 'zh-CN'
  contentDir = 'content'
  title = "lyrumu's page"

  [languages.zh-cn.params]
    displayName = '简体中文'
    isoCode = 'zh-cn'
    rtl = false
    dateFormat = '2006-01-02'
    logo = ''
    description = ''

    [languages.zh-cn.params.author]
      name = 'lyrumu'
      email = ''

      # 作者头像图片，会在页面的作者信息区域显示（如文章页作者栏、关于页面等）
      # 图片路径写法：
      # 本地图片支持两种存放方式，二选一即可：
      # 1. 放入 assets/images/ 目录，引用时写相对根目录的路径，例如 'images/avatar.jpg'
      # 2. 放入 static/ 目录，引用时写完整的相对根路径，例如放在 static/images/ 则写 '/images/avatar.jpg'
      # 2. 外部图片：直接填写完整的 CDN/在线图片 URL，例如 'https://example.com/avatar.jpg'
      image = 'images/melody.png'

      headline = 'Recordings'
      bio = ''
      links = [
        { github = 'https://github.com/' },
        { email = 'mailto:' },
      ]

# =============================================================================
# 主题与构建
# =============================================================================
theme = 'blowfish'

relativeURLs = true
disablePathToLower = true
enableRobotsTXT = true

hasCJKLanguage = true
summaryLength = 30
enableEmoji = true

# =============================================================================
# 站点参数
# =============================================================================
[params]
  colorScheme = 'princess' #初始为blowfish
  defaultAppearance = 'dark'
  autoSwitchAppearance = true
  enableSearch = true
  enableCodeCopy = true
  enableImageLazyLoad = true
  enableBreadcrumbs = true
  enableStructuredBreadcrumbs = true
  highlightCurrentMenuArea = true
  smartTOC = true

  # 哪些 section 会出现在"最近更新" / 侧栏 quick links
  mainSections = ['notes', 'life', 'works', 'about']

  defaultBackgroundImage = ''
  defaultFeaturedImage = ''

  # =====================================================================
  # 首页（封面）布局：使用 custom 布局，渲染在
  #   layouts/partials/home/custom.html
  # 数据驱动：data/cover.yaml
  # =====================================================================
  [params.homepage]
    layout = 'custom'                  # background / hero / page / card / custom
    showRecent = false
    showQuickLinks = false
    showSummary = false
    cardViewSimple = false
    disableSpecialFirstPost = true
    mainSections = ['notes', 'works', 'life']

  # /start/ 大厅页的"最近文章"行为（被 [params.homepage] 影响，但独立可控）
  [params.list]
    showHero = false
    showSummary = true
    showBreadcrumbs = true
    showTableOfContents = false
    showCards = true
    cardView = true
    groupByYear = false
    orderByWeight = true

  [params.article]
    showHero = true
    heroStyle = 'background'
    showDate = true
    showDateUpdated = false
    showAuthor = true
    showBreadcrumbs = true
    showDraftLabel = true
    showTableOfContents = true
    showReadingTime = true
    showWordCount = false
    showRelatedContent = true
    relatedContentLimit = 6
    showZenMode = true
    sharingLinks = ['github', 'twitter', 'email']

  [params.term]
    showHero = true
    showBreadcrumbs = true
    showTableOfContents = false
    cardView = true

  [params.taxonomy]
    showTermCount = true
    showHero = true
    showBreadcrumbs = true
    showTableOfContents = false
    cardView = false

  [params.footer]
    showMenu = true
    showCopyright = true
    showThemeAttribution = true
    showAppearanceSwitcher = true
    showScrollToTop = true

  [params.header]
    layout = 'fixed'                  # basic / fixed / fixed-fill / fixed-gradient / fixed-fill-blur

  [params.cover]
    linkFullImages = true
    hiddenInList = false

# =============================================================================
# 顶部分类导航
# 加模块 = 在这里加一项 + content/<slug>/_index.md
# 顺序：按 weight 从小到大
# =============================================================================
[[menu.main]]
  name = '文档'
  url = '/notes/'
  # weight 参数用于控制导航菜单的排序顺序，数值越小越靠前显示
  weight = 10

[[menu.main]]
  name = '相关'
  url = '/works/'
  weight = 20

[[menu.main]]
  name = '日常'
  url = '/life/'
  weight = 30

[[menu.main]]
  name = '联系我'
  url = '/about/'
  weight = 40

# =============================================================================
# 输出格式
# =============================================================================
[outputs]
  home = ['HTML', 'RSS', 'JSON']
  section = ['HTML', 'RSS']
  taxonomy = ['HTML', 'RSS']
  term = ['HTML']

# =============================================================================
# 标记与渲染
# =============================================================================
[markup]
  defaultMarkdownHandler = 'goldmark'
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = false
    style = 'github-dark'
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

# =============================================================================
# 分面（标签 / 主题 / 分类 / 系列）
# =============================================================================
[taxonomies]
  category = 'categories'
  tag = 'tags'
  topic = 'topics'
  series = 'series'

# 抑制已知无害的日志
ignoreLogs = ["warning-goldmark-raw-html"]
