# =============================================================================
# lyrumu's site — Hugo configuration
# Theme: Blowfish · 部署 Cloudflare Pages
#
# 模块说明（2026-06-24 更新）：
#   - 封面（/）         → 无顶栏，只显示标题 + 入口按钮（点进 /about/）
#   - /about/           → 主入口（原 Catalogue 位置升级），含个人简介 + 顶栏右侧索引
#   - /notes/ /life/ /works/ → 三块内容板块，由顶栏右侧 menu.main 导航
#   - 加新模块 = hugo.toml [[menu.main]] 加项 + content/<slug>/_index.md
#
# 历史：原 /start/ 大厅页已删除（2026-06-24），顶栏左侧的"主入口"由
# [[menu.main]] identifier = "home" 的菜单项通过 header/basic.html 渲染，
# desktop-menu / mobile-menu 按 identifier 跳过该项避免重复。
# =============================================================================

baseURL = 'https://lyrumu.top/'
defaultContentLanguage = 'en'
title = "lyrumu's page"

# =============================================================================
# 多语言
# 默认语言从 zh-cn 改为 en（2026-06-24）
# - 语言键重命名 [languages.zh-cn] → [languages.en]
# - label / displayName / isoCode / locale 同步更新为英文
# - contentDir 仍为 'content'，URL 路径不变，无需迁移文件
# =============================================================================
[languages.en]
  label = 'English'
  weight = 1
  locale = 'en-US'
  contentDir = 'content'
  title = "lyrumu's page"

  [languages.en.params]
    displayName = 'English'
    isoCode = 'en'
    rtl = false
    dateFormat = '2006-01-02'
    logo = ''
    description = ''

    [languages.en.params.author]
      name = 'lyrumu'
      email = ''

      # 作者头像图片，会在页面的作者信息区域显示（如文章页作者栏、关于页面等）
      # 图片路径写法：
      # 本地图片支持两种存放方式，二选一即可：
      # 1. 放入 assets/images/ 目录，引用时写相对根目录的路径，例如 'images/avatar.jpg'
      # 2. 放入 static/ 目录，引用时写完整的相对根路径，例如放在 static/images/ 则写 '/images/avatar.jpg'
      # 2. 外部图片：直接填写完整的 CDN/在线图片 URL，例如 'https://example.com/avatar.jpg'
      image = 'images/melody.png'

      headline = 'Recordings'
      bio = ''
      links = [
        { github = 'https://github.com/' },
        { email = 'mailto:' },
      ]

# =============================================================================
# 主题与构建
# =============================================================================
theme = 'blowfish'

relativeURLs = true
disablePathToLower = true
enableRobotsTXT = true

# 文章正文以中文居多 → 保留 CJK 分词/字数/换行规则
# 与 defaultContentLanguage = 'en' 不冲突：
# - defaultContentLanguage 管 URL/i18n/语言切换
# - hasCJKLanguage    管正文分词、summaryLength、阅读时间
hasCJKLanguage = true
summaryLength = 30
enableEmoji = true

# =============================================================================
# 站点参数
# =============================================================================
[params]
  colorScheme = 'princess' #初始为blowfish
  defaultAppearance = 'dark'
  autoSwitchAppearance = true
  enableSearch = true
  enableCodeCopy = true
  enableImageLazyLoad = true
  enableBreadcrumbs = true
  enableStructuredBreadcrumbs = true
  highlightCurrentMenuArea = true
  smartTOC = true

  # 哪些 section 会出现在"最近更新" / 侧栏 quick links
  mainSections = ['notes', 'life', 'works', 'about']

  defaultBackgroundImage = ''
  defaultFeaturedImage = ''

  # =====================================================================
  # 首页（封面）布局：使用 custom 布局，渲染在
  #   layouts/partials/home/custom.html
  # 数据驱动：data/cover.yaml
  # =====================================================================
  [params.homepage]
    layout = 'custom'                  # background / hero / page / card / custom
    showRecent = false
    showQuickLinks = false
    showSummary = false
    cardViewSimple = false
    disableSpecialFirstPost = true
    mainSections = ['notes', 'works', 'life']

  # 列表页（/notes/ /works/ /life/ 等）的"列表卡片"行为
  # （被 [params.homepage] 影响，但独立可控）
  [params.list]
    showHero = false
    showSummary = true
    showBreadcrumbs = true
    showTableOfContents = false
    showCards = true
    cardView = true
    groupByYear = false
    orderByWeight = true

  [params.article]
    showHero = true
    heroStyle = 'background'
    showDate = true
    showDateUpdated = false
    showAuthor = true
    showBreadcrumbs = true
    showDraftLabel = true
    showTableOfContents = true
    showReadingTime = true
    showWordCount = true
    showRelatedContent = true #管理相关近期文章的显示
    relatedContentLimit = 6
    showZenMode = true
    sharingLinks = ['github', 'twitter', 'email']

  [params.term]
    showHero = true
    showBreadcrumbs = true
    showTableOfContents = true
    cardView = true

  [params.taxonomy]
    showTermCount = true
    showHero = true
    showBreadcrumbs = true
    showTableOfContents = true
    cardView = true

  [params.footer]
    showMenu = true
    showCopyright = true
    showThemeAttribution = true
    showAppearanceSwitcher = true
    showScrollToTop = true

  [params.header]
    layout = 'fixed'                  # basic / fixed / fixed-fill / fixed-gradient / fixed-fill-blur

  [params.cover]
    linkFullImages = true
    hiddenInList = false

# =============================================================================
# 顶部分类导航
# 加模块 = 在这里加一项 + content/<slug>/_index.md
# 顺序：按 weight 从小到大
# =============================================================================
# 主入口"ABOUT ME"（2026-06-24 重构）
# - identifier = "home" 标识它由 header/basic.html 渲染在顶栏左侧（原 Catalogue 位置）
# - desktop-menu.html / mobile-menu.html 通过 if ne .Identifier "home" 跳过此项，
#   避免在右侧 menu.main 中重复出现
# - 改 name / url 后只需改这一处，左侧渲染 + 右侧跳过都自动跟随
[[menu.main]]
  identifier = 'home'
  name = 'ABOUT ME'
  url = '/about/'
  # weight 参数用于控制导航菜单的排序顺序，数值越小越靠前显示
  weight = 10

[[menu.main]]
  name = 'DOCS'
  url = '/notes/'
  weight = 20

[[menu.main]]
  name = 'WORKS'
  url = '/works/'
  weight = 30

[[menu.main]]
  name = 'DAILY'
  url = '/life/'
  weight = 40

# =============================================================================
# 输出格式（2026-06-24 修正两个 WARN）
# - 加 page = ['HTML']：消除 "no layout file for html for kind page" 警告
#   （不写 page 时 Hugo 用默认 _default/single.html 也能渲染，但会发 WARN）
# - JSON 保留：home 的 JSON 输出由 layouts/home.json 提供，消除
#   "no layout file for json for layout background for kind home" 警告
#   （主题的 _default/index.json 仍作为其它 kind 的 catch-all）
# =============================================================================
[outputs]
  home = ['HTML', 'RSS', 'JSON']
  section = ['HTML', 'RSS']
  taxonomy = ['HTML', 'RSS']
  term = ['HTML']
  page = ['HTML']

# =============================================================================
# 标记与渲染
# =============================================================================
[markup]
  defaultMarkdownHandler = 'goldmark'
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = false
    style = 'github-dark'
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

# =============================================================================
# 分面（标签 / 主题 / 分类 / 系列）
# =============================================================================
[taxonomies]
  category = 'categories'
  tag = 'tags'
  topic = 'topics'
  series = 'series'

# 抑制已知无害的日志
# - warning-goldmark-raw-html：blowfish 主题原 html 写法触发，金标 markdown 的已知噪音
ignoreLogs = ["warning-goldmark-raw-html"]
