# =============================================================================
# lyrumu's site — Hugo build CI
#
# 部署说明（Cloudflare Pages）：
#   1. 在 Cloudflare Pages 控制台连接此 GitHub 仓库
#   2. Build command:   hugo
#   3. Build output:    public
#   4. 环境变量 HUGO_VERSION = 0.163.2
#   5. (可选) 环境变量 HUGO_ENV = production
#
# 本 workflow 只做构建验证 + 产出 public/ 工件
# 实际部署由 Cloudflare Pages 通过 Git 集成完成（无需 wrangler action）
# =============================================================================

name: Build Hugo site

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'hugo-build'
  cancel-in-progress: true

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.163.2'
          extended: true

      - name: Cache Hugo modules
        uses: actions/cache@v4
        with:
          path: |
            resources/_gen
            .hugo_build.lock
          key: hugo-${{ runner.os }}-${{ hashFiles('**/go.mod', '**/hugo.toml') }}
          restore-keys: |
            hugo-${{ runner.os }}-

      - name: Build
        run: hugo --minify --themesDir themes --theme blowfish --config hugo.toml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-public
          path: public
          retention-days: 7
          if-no-files-found: error

  build-status:
    name: Build status check
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Report
        run: echo "Build result: ${{ needs.build.result }}"
