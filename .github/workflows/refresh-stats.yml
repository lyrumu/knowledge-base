name: Refresh site stats

# =============================================================================
# Refresh site stats (2026-06-24 新增)
# ---------------------------------------------------------------------------
# 每天 03:00 UTC 跑一次（北京时间 11:00），拉 GitHub stars + CF Analytics PV/UV
# → 写回 data/site-stats.yaml → commit 触发 CF Pages 重建
# 手动触发：Actions 页面 → "Run workflow"
#
# 触发后产生的 commit 会自动触发 CF Pages 重建（约 30-60s 后数据生效）
# =============================================================================

on:
  schedule:
    # 每天 03:00 UTC（北京时间 11:00）跑
    - cron: '0 3 * * *'
  workflow_dispatch:                     # 手动触发（Actions 页面 → Run workflow）
    inputs:
      reason:
        description: 'Why running manually?'
        required: false
        default: 'manual refresh'

# 防止并发跑（前一次没跑完不跑下一次）
concurrency:
  group: refresh-stats
  cancel-in-progress: false

# 最小权限：只读 + 写 commit
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 拉完整 history（commit 时需要）
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run refresh script
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: python scripts/refresh_stats.py

      - name: Show diff
        run: |
          echo "===== data/site-stats.yaml diff ====="
          git diff --stat data/site-stats.yaml || echo "(no changes)"
          echo "===== full diff ====="
          git diff data/site-stats.yaml || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/site-stats.yaml
          # 只有 yaml 真的变了才提交
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(stats): auto-refresh from GitHub + Cloudflare [skip ci]"
            git push
            echo "✅ Pushed, CF Pages will rebuild in ~30-60s"
          fi
