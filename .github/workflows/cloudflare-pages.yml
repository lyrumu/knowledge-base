# =============================================================================
# Cloudflare Pages 部署（可选）
#
# 默认推荐使用 Cloudflare Pages 的 Git 集成（无需此 workflow）
# 启用此 workflow 时：
#   - 在 GitHub Repo Settings → Secrets 配置：
#     CLOUDFLARE_API_TOKEN     （Pages Edit 权限）
#     CLOUDFLARE_ACCOUNT_ID    （账户 ID）
#     CLOUDFLARE_PROJECT_NAME  （Pages 项目名）
# =============================================================================

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.163.2"
          extended: true

      - name: Build
        run: hugo --minify --themesDir themes --theme blowfish --config hugo.toml

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
