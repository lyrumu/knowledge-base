{{/*
  Giscus 评论加载器（2026-07-25 从 inline 外置到 assets/js）
  - 路径白名单 + notes 文章页自动识别 + 深浅主题切换：与原 inline 逻辑一致
  - defer 执行时 DOM 已解析，document.querySelector('article') 安全
  - 指纹化后每页 HTML 变薄，脚本可跨页缓存
*/}}
{{ $giscusLoader := resources.Get "js/giscus-loader.js" | resources.Minify | resources.Fingerprint "sha512" }}
<script defer src="{{ $giscusLoader.RelPermalink }}" integrity="{{ $giscusLoader.Data.Integrity }}"></script>
